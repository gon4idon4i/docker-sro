# Своя конфигурация сервера вместо стандартной default.conf
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Сжатие текста — страница грузится быстрее
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Своя страница 404
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Статика кэшируется браузером на неделю
    location ~* \.(css|js|png|jpg|svg)$ {
        expires 7d;
    }

    # Для HEALTHCHECK и быстрой проверки curl'ом
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Скрываем версию nginx в заголовках
    server_tokens off;
}
